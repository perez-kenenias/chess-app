# nginx.conf — sirve el build estático de React y hace de proxy hacia el backend.
#
# ¿Por qué proxy en vez de que el navegador llame directo al backend?
# Así el frontend siempre pide a "/api" (mismo origen, sin CORS, sin puerto
# hardcodeado) y nginx reenvía internamente al contenedor "backend" por el
# nombre del servicio de docker-compose. Funciona igual en localhost que en
# un servidor remoto, sin tocar nada.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo real cae en index.html
    # (React Router no se usa aquí, pero evita 404 al recargar sub-rutas)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # El análisis con profundidad alta puede tardar más que el timeout
        # por defecto de nginx (60s) — el frontend ya usa 60s en axios,
        # aquí damos un margen extra.
        proxy_read_timeout 75s;
        proxy_connect_timeout 10s;
    }
}
